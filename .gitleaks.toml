# Configuration gitleaks — copiée automatiquement à la racine du dépôt par `mkrpo`.
#
# Étend le ruleset par défaut de gitleaks (ne le remplace pas) : `extend.useDefault`
# garde toutes les règles intégrées, `[allowlist]` ne fait qu'ajouter des exceptions.
#
# 📖 Référence et exemples : repos-meta/SECRET_SCANNING.md

[extend]
useDefault = true

[allowlist]
regexes = [
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ\.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c''',
  # Token JWT d'exemple canonique de jwt.io ("John Doe"), utilisé pour illustrer la
  # structure d'un JWT dans docs/modules/jwt/pages/jwt.adoc (et l'ancien jwt/README.adoc,
  # présent dans l'historique avant migration vers docs/) — jamais un vrai secret.

  '''ASIAAAAIEAEAAAAASIAA''',
  # Faux positif règle aws-access-token : fragment de données binaires compressées
  # (format mxfile de draw.io, base64) dans computing-learner-roadmap/roadmap.drawio et
  # computing-learner-roadmap/dev/circles.drawio — coïncidence de motif, pas une clé AWS.
]
